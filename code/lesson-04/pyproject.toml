[project]
name = "docmate"
version = "0.1.0"
description = "A private AI assistant that runs on your own computer with Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
]

[project.scripts]
docmate = "docmate:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
